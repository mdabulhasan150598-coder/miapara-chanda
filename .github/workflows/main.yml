name: Build Mosque APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK Cleanly
        run: |
          cd ..
          rm -rf miapara_app
          flutter create miapara_app --org com.miapara.chanda
          cd miapara_app

          rm -rf test

          flutter pub add sqflite path intl public_file_saver

          # main.dart ফাইল কপি করা
          if [ -f "$GITHUB_WORKSPACE/main.dart" ]; then
            cp "$GITHUB_WORKSPACE/main.dart" lib/main.dart
          elif [ -f "$GITHUB_WORKSPACE/lib/main.dart" ]; then
            cp "$GITHUB_WORKSPACE/lib/main.dart" lib/main.dart
          fi

          # Native Android document picker: no third-party file-picker plugin
          mkdir -p android/app/src/main/kotlin/com/miapara/chanda/miapara_app
          cat > android/app/src/main/kotlin/com/miapara/chanda/miapara_app/MainActivity.kt <<'KOTLIN'
          package com.miapara.chanda.miapara_app

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.provider.OpenableColumns
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channelName = "miapara/file_picker"
              private val requestCode = 7412
              private var pendingResult: MethodChannel.Result? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                      .setMethodCallHandler { call, result ->
                          if (call.method != "pickJsonBackup") {
                              result.notImplemented()
                              return@setMethodCallHandler
                          }
                          if (pendingResult != null) {
                              result.error("PICKER_BUSY", "A file selection is already in progress.", null)
                              return@setMethodCallHandler
                          }
                          pendingResult = result
                          val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "application/json"
                              addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          }
                          try {
                              startActivityForResult(intent, requestCode)
                          } catch (e: Exception) {
                              pendingResult = null
                              result.error("PICKER_LAUNCH_FAILED", e.message, null)
                          }
                      }
              }

              @Deprecated("Deprecated in Android, retained for Activity result compatibility")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != this.requestCode) return
                  val callback = pendingResult ?: return
                  pendingResult = null
                  if (resultCode != Activity.RESULT_OK || data?.data == null) {
                      callback.success(null)
                      return
                  }
                  try {
                      val uri: Uri = data.data!!
                      val bytes = contentResolver.openInputStream(uri)?.use { it.readBytes() }
                          ?: throw IllegalStateException("Unable to read selected file")
                      var name = "backup.json"
                      contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                          val index = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (index >= 0 && cursor.moveToFirst()) name = cursor.getString(index) ?: name
                      }
                      callback.success(mapOf("name" to name, "bytes" to bytes))
                  } catch (e: Exception) {
                      callback.error("FILE_READ_FAILED", e.message, null)
                  }
              }
          }
          KOTLIN

          # অ্যান্ড্রয়েড লিন্ট এরর বাইপাস করা
          echo "android.lintOptions.checkReleaseBuilds=false" >> android/gradle.properties
          echo "android.lintOptions.abortOnError=false" >> android/gradle.properties

          # ইন্টারনেট পারমিশন স্বয়ংক্রিয়ভাবে যোগ করা
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

          # সরাসরি APK তৈরি
          flutter build apk --release --no-tree-shake-icons

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/output/miapara-chanda.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miapara-masjid-chanda-apk
          path: output/miapara-chanda.apk
